<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스플랫 뷰어</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee;
               font: 13px/1.6 system-ui, "Malgun Gothic", sans-serif; overflow: hidden; }
  #panel { position: fixed; top: 12px; left: 12px; z-index: 10; max-width: 340px;
           background: rgba(0,0,0,.72); border: 1px solid #333; border-radius: 8px; padding: 12px 14px; }
  #steps { list-style: none; margin: 0 0 10px; padding: 0; }
  #steps li { padding: 1px 0; color: #888; }
  #steps li.ok   { color: #6ee7a8; }
  #steps li.busy { color: #f0d264; }
  #steps li.bad  { color: #ff7a7a; }
  #steps .hint { display: block; color: #ff7a7a; font-size: 12px; padding-left: 18px; opacity: .85; }
  #stats { border-top: 1px solid #333; padding-top: 8px; color: #bbb; white-space: pre-line; }
  #bar { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  button, label.file { background: #222; color: #eee; border: 1px solid #444; border-radius: 6px;
                       padding: 5px 10px; cursor: pointer; font: inherit; }
  button:hover, label.file:hover { background: #2e2e2e; }
  #drop { position: fixed; inset: 0; z-index: 20; display: none; background: rgba(20,40,70,.75);
          align-items: center; justify-content: center; font-size: 22px; pointer-events: none; }
  #drop.on { display: flex; }
</style>
</head>
<body>

<div id="panel">
  <ul id="steps"></ul>
  <div id="stats">—</div>
  <div id="bar">
    <button id="flip">위아래 뒤집기</button>
    <label class="file">파일 선택<input id="pick" type="file" accept=".ply,.spz,.sog,.splat,.ksplat" hidden></label>
  </div>
</div>
<div id="drop">여기에 놓으세요</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://unpkg.com/@sparkjsdev/spark@2.2.0/dist/spark.module.js"
  }
}
</script>

<script type="module">
// ── 띄울 파일. 이 한 줄만 바꾸면 된다 ────────────────
const FILE = "scene_splat.ply";
// ────────────────────────────────────────────────────

// 확장자 -> 형식 이름 대응표. 확장자를 그대로 넘기면 안 된다.
const TYPES = {
  ".ply":   "ply",
  ".splat": "splat",
  ".ksplat":"ksplat",
  ".spz":   "spz",
  ".sog":   "pcsogszip",   // .sog 의 안쪽 이름
};

function fileTypeOf(name) {
  const n = name.toLowerCase();
  for (const ext of Object.keys(TYPES).sort((a, b) => b.length - a.length)) {
    if (n.endsWith(ext)) return TYPES[ext];
  }
  return null;
}

// ── 단계 목록 ────────────────────────────────────────
const STEPS = [
  ["lib",   "라이브러리 불러오기"],
  ["spark", "렌더러 넣기"],
  ["fetch", "파일 받기"],
  ["parse", "알갱이로 풀기"],
  ["size",  "크기 재기"],
];
const ul = document.getElementById("steps");
const li = {};
for (const [key, label] of STEPS) {
  const el = document.createElement("li");
  el.textContent = "· " + label;
  el.dataset.label = label;
  ul.appendChild(el);
  li[key] = el;
}
function step(key, state, hint) {
  const el = li[key];
  el.className = state;
  const mark = { busy: "…", ok: "✓", bad: "✗" }[state] || "·";
  el.textContent = mark + " " + el.dataset.label;
  if (hint) {
    const s = document.createElement("span");
    s.className = "hint";
    s.textContent = hint;
    el.appendChild(s);
  }
}
const stats = document.getElementById("stats");
function say(lines) { stats.textContent = lines.join("\n"); }

// ── 라이브러리 ───────────────────────────────────────
step("lib", "busy");
let THREE, OrbitControls, SparkRenderer, SplatMesh;
try {
  THREE = await import("three");
  ({ OrbitControls } = await import("three/addons/controls/OrbitControls.js"));
  ({ SparkRenderer, SplatMesh } = await import("@sparkjsdev/spark"));
  step("lib", "ok");
} catch (e) {
  step("lib", "bad", "CDN 을 못 불러왔습니다. 인터넷 연결과 F12 콘솔의 import 오류를 보세요.");
  throw e;
}

// ── 장면 ─────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 1000);
camera.position.set(0, 0, 3);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// Spark 전용 렌더러를 **장면에 넣는다**. 이 줄이 빠지면 화면이 검은 채로 조용히 있는다.
step("spark", "busy");
try {
  const spark = new SparkRenderer({ renderer });
  scene.add(spark);
  step("spark", "ok");
} catch (e) {
  step("spark", "bad", "SparkRenderer 를 장면에 못 넣었습니다. 콘솔을 보세요.");
  throw e;
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
})();

// ── 불러오기 ─────────────────────────────────────────
let mesh = null;
let flipped = false;

async function load(name, bytes, ms) {
  // 크기는 **지금** 잰다. Spark 가 버퍼를 가져가면 byteLength 가 0이 된다.
  const size = bytes.byteLength;
  const fileType = fileTypeOf(name);
  if (!fileType) {
    step("parse", "bad", "모르는 확장자입니다: " + name);
    return;
  }

  if (mesh) { scene.remove(mesh); mesh.dispose?.(); mesh = null; }

  step("parse", "busy");
  try {
    mesh = new SplatMesh({ fileBytes: new Uint8Array(bytes), fileType });
    scene.add(mesh);
    await mesh.initialized;
    step("parse", "ok");
  } catch (e) {
    step("parse", "bad", "형식 이름이 맞는지 보세요 (" + fileType + "). 콘솔에 자세한 오류가 있습니다.");
    throw e;
  }

  // 크기는 Spark 가 주는 자로 잰다. three.js 의 Box3.setFromObject 는 빈 상자를 준다.
  step("size", "busy");
  let count = 0, box = new THREE.Box3(), got = false;
  try {
    if (typeof mesh.forEachSplat === "function") {
      const v = new THREE.Vector3();
      mesh.forEachSplat((i, center) => {
        count++;
        v.set(center.x, center.y, center.z);
        box.expandByPoint(v);
      });
      got = count > 0;
    }
    if (!got) {
      count = mesh.packedSplats?.numSplats ?? mesh.numSplats ?? 0;
      box.set(new THREE.Vector3(-1, -1, -1), new THREE.Vector3(1, 1, 1));
    }
    step("size", got ? "ok" : "bad", got ? null : "알갱이 위치를 못 읽어 임시 상자를 썼습니다.");
  } catch (e) {
    step("size", "bad", "크기를 못 쟀습니다. 콘솔을 보세요.");
  }

  const center = box.getCenter(new THREE.Vector3());
  const span = box.getSize(new THREE.Vector3()).length() || 4;
  controls.target.copy(center);
  camera.position.copy(center).add(new THREE.Vector3(0, 0, span * 0.8));
  camera.near = span / 1000;
  camera.far = span * 20;
  camera.updateProjectionMatrix();
  controls.update();

  say([
    name,
    "파일 크기   " + (size / 1048576).toFixed(1) + " MB (" + size.toLocaleString() + " 바이트)",
    "받는 데     " + (ms / 1000).toFixed(2) + "초",
    "알갱이      " + count.toLocaleString() + " 개",
    "알갱이당    " + (count ? (size / count).toFixed(1) : "—") + " 바이트",
  ]);
}

async function loadUrl(url) {
  step("fetch", "busy");
  const t0 = performance.now();
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status + " " + res.statusText);
    const buf = await res.arrayBuffer();
    step("fetch", "ok");
    await load(url.split("/").pop(), buf, performance.now() - t0);
  } catch (e) {
    step("fetch", "bad",
      "같은 폴더에 파일이 있는지 보세요. 더블클릭으로 연 경우 브라우저가 막습니다 — " +
      "창에 파일을 끌어다 놓거나 「파일 선택」을 쓰세요.");
  }
}

async function loadFile(f) {
  step("fetch", "busy");
  const t0 = performance.now();
  const buf = await f.arrayBuffer();
  step("fetch", "ok");
  await load(f.name, buf, performance.now() - t0);
}

// 끌어다 놓기 (과제 3단계에서 쓴다)
const drop = document.getElementById("drop");
addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("on"); });
addEventListener("dragleave", e => { if (e.relatedTarget === null) drop.classList.remove("on"); });
addEventListener("drop", e => {
  e.preventDefault();
  drop.classList.remove("on");
  const f = e.dataTransfer.files[0];
  if (f) loadFile(f);
});
document.getElementById("pick").addEventListener("change", e => {
  const f = e.target.files[0];
  if (f) loadFile(f);
});

document.getElementById("flip").addEventListener("click", () => {
  if (!mesh) return;
  flipped = !flipped;
  mesh.rotation.x = flipped ? Math.PI : 0;
});

// 주소 뒤에 ?file=이름 을 붙이면 그 파일로 시작한다
const asked = new URLSearchParams(location.search).get("file");
loadUrl(asked || FILE);
</script>
</body>
</html>
